[package]
name = "tessera-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "The tesserax command: opens a recipe, then serves, fetches or runs tasks"

[[bin]]
name = "tesserax"
path = "src/main.rs"

[features]
default = ["guided"]
# A bare prompt picks a command through llguidance.
guided = ["tessera-serve/guided"]
cuda = ["tessera-serve/cuda"]
rocm = ["tessera-serve/rocm"]

[dependencies]
tessera-bundle = { workspace = true }
tessera-engine = { workspace = true }
tessera-frontend-settings = { workspace = true }
tessera-recipe = { workspace = true }
tessera-serve = { workspace = true }
tessera-tasks = { workspace = true }
serde_json = "1"

[dev-dependencies]
tessera-testkit = { workspace = true }
