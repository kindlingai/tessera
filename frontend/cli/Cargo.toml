[package]
name = "sensai-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The sensai command: opens a recipe, then serves, fetches or runs tasks"

[[bin]]
name = "sensai"
path = "src/main.rs"

[features]
default = []
cuda = ["sensai-serve/cuda"]
rocm = ["sensai-serve/rocm"]

[dependencies]
sensai-bundle = { workspace = true }
sensai-engine = { workspace = true }
sensai-frontend-settings = { workspace = true }
sensai-recipe = { workspace = true }
sensai-serve = { workspace = true }
sensai-tasks = { workspace = true }
serde_json = "1"

[dev-dependencies]
sensai-testkit = { workspace = true }
