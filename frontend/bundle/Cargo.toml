[package]
name = "tessera-bundle"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A Hugging Face model directory as graph, weights, tokenizer and template"

[dependencies]
tessera-engine = { workspace = true }
tessera-checkpoint = { workspace = true }
fancy-regex = "0.14"
jiff = "0.2"
minijinja = { version = "3", features = ["json", "loop_controls", "preserve_order", "serde"] }
minijinja-contrib = { version = "3", features = ["pycompat"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rmp-serde = "1"
rmpv = "1"
scattered-collect = "0.22"
tokenizers = { version = "0.22", default-features = false, features = ["unstable_wasm"] }

[dev-dependencies]
tessera-testkit = { workspace = true }
toml = "0.8"
