[package]
name = "sensai-bundle"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A Hugging Face model directory as graph, weights, tokenizer and template"

[dependencies]
thiserror = "2"
sensai-engine = { workspace = true }
sensai-checkpoint = { workspace = true }
fancy-regex = "0.14"
jiff = "0.2"
minijinja = { version = "3", features = ["json", "loop_controls", "serde"] }
minijinja-contrib = { version = "3", features = ["pycompat"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
rmpv = "1"
tokenizers = { version = "0.22", default-features = false, features = ["unstable_wasm"] }

[dev-dependencies]
sensai-testkit = { workspace = true }
