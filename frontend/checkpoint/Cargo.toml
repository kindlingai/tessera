[package]
name = "tessera-checkpoint"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Reads weights from safetensors files"

[dependencies]
ring = "0.17"
thiserror = "2"
tessera-engine = { workspace = true }
tessera-frontend-settings = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"

[dev-dependencies]
tessera-testkit = { workspace = true }
