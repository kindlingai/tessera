[package]
name = "sensai-checkpoint"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Reads weights from safetensors files"

[dependencies]
thiserror = "2"
sensai-engine = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"

[dev-dependencies]
sensai-frontend-settings = { workspace = true }
sensai-testkit = { workspace = true }
