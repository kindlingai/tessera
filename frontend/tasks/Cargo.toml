[package]
name = "tessera-tasks"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Text in, answers out: generation and tagging over a loaded model"

[features]
default = []
cuda = ["tessera-engine/cuda"]
rocm = ["tessera-engine/rocm"]
# Answers held to a JSON format, through llguidance.
guided = ["dep:tessera-grammar", "tessera-grammar/llguidance"]

[dependencies]
tessera-bundle = { workspace = true }
tessera-engine = { workspace = true }
tessera-grammar = { workspace = true, optional = true }
tessera-task-derive = { workspace = true }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
tessera-checkpoint = { workspace = true }
tessera-frontend-settings = { workspace = true }
tessera-recipe = { workspace = true }
tessera-testkit = { workspace = true }
