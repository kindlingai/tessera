[package]
name = "sensai-tasks"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Text in, answers out: generation and tagging over a loaded model"

[features]
default = []
cuda = ["sensai-engine/cuda"]
rocm = ["sensai-engine/rocm"]
# Answers held to a JSON format, through llguidance.
guided = ["dep:sensai-grammar", "sensai-grammar/llguidance"]

[dependencies]
sensai-bundle = { workspace = true }
sensai-engine = { workspace = true }
sensai-grammar = { workspace = true, optional = true }
serde_json = "1"

[dev-dependencies]
sensai-checkpoint = { workspace = true }
sensai-frontend-settings = { workspace = true }
sensai-recipe = { workspace = true }
sensai-testkit = { workspace = true }
