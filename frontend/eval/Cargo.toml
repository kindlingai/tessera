[package]
name = "sensai-eval"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Measures a recipe's model: batch speed, and parity with a reference"

[[bin]]
name = "tessera-eval"
path = "src/main.rs"

[features]
default = []
cuda = ["sensai-engine/cuda"]
rocm = ["sensai-engine/rocm"]

[dependencies]
sensai-engine = { workspace = true }
sensai-bundle = { workspace = true }
sensai-checkpoint = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sensai-tasks = { workspace = true }
sensai-frontend-settings = { workspace = true }
