[package]
name = "eval"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Measures a model under a recipe: speed per batch, parity against a reference"

[[bin]]
name = "tessera-eval"
path = "src/main.rs"

[features]
default = []
cuda = ["engine/cuda"]
rocm = ["engine/rocm"]

[dependencies]
engine = { workspace = true }
bundle = { workspace = true }
checkpoint = { workspace = true }
lower = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
settings = { workspace = true }
