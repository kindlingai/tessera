[package]
name = "sensai-serve"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "OpenAI-shaped HTTP routes over generation, chat and embedding"

[lib]
path = "src/lib.rs"

[[bin]]
name = "tessera-serve"
path = "src/main.rs"

[features]
default = []
cuda = ["sensai-engine/cuda", "sensai-tasks/cuda"]
rocm = ["sensai-engine/rocm", "sensai-tasks/rocm"]
# `response_format` through llguidance. Needs `--guided` at start.
guided = ["sensai-tasks/guided"]

[dependencies]
sensai-engine = { workspace = true }
sensai-bundle = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sensai-frontend-settings = { workspace = true }
httparse = "1"
sensai-tasks = { workspace = true }
