[package]
name = "tessera-serve"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "OpenAI-shaped HTTP routes over generation, chat and embedding"

[lib]
path = "src/lib.rs"

[[bin]]
name = "tessera-serve"
path = "src/main.rs"

[features]
default = []
cuda = ["tessera-engine/cuda", "tessera-tasks/cuda"]
rocm = ["tessera-engine/rocm", "tessera-tasks/rocm"]
# `response_format` through llguidance. Needs `--guided` at start.
guided = ["tessera-tasks/guided"]

[dependencies]
tessera-engine = { workspace = true }
tessera-bundle = { workspace = true }
serde = { version = "1", features = ["derive"] }
# Questions answer in the order a request gives them.
serde_json = { version = "1", features = ["preserve_order"] }
tessera-frontend-comm = { workspace = true }
tessera-frontend-settings = { workspace = true }
httparse = "1"
tessera-tasks = { workspace = true }

[dev-dependencies]
tessera-models = { workspace = true }
tessera-testkit = { workspace = true }
