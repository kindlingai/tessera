[package]
name = "sensai-recipe"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A model, weights, and plan and serve settings, from disk or git"

[dependencies]
thiserror = "2"
sensai-engine = { workspace = true }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
sensai-testkit = { workspace = true }
