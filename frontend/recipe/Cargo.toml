[package]
name = "sensai-recipe"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A model, its weights and how to plan and serve it, from a directory or git"

[dependencies]
thiserror = "2"
sensai-engine = { workspace = true }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
sensai-testkit = { workspace = true }
