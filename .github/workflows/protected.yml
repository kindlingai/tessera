name: Protected files

# pull_request_target runs main's copy of this file and its scripts,
# so a PR cannot change its own checks. It never runs PR code.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, unlabeled, ready_for_review]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: protected-${{ github.event.pull_request.number }}

jobs:
  human-review:
    # A draft waits. The ready_for_review event starts the run CI's success needs.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Label changes to protected files
        if: contains(fromJSON('["opened", "reopened", "synchronize", "ready_for_review"]'), github.event.action)
        run: |
          # README.md changes inside the generated crate table skip review.
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
            | tools/scripts/review-paths.sh \
            | tools/scripts/protected.sh > "$RUNNER_TEMP/hits"
          cat "$RUNNER_TEMP/hits"
          tools/scripts/protected-label.sh < "$RUNNER_TEMP/hits"
      - name: Rerun CI's success job
        # A finished success job read the old label or setting.
        if: contains(fromJSON('["edited", "unlabeled"]'), github.event.action)
        run: tools/scripts/rerun-success.sh "$SHA"
      - run: tools/scripts/pr-gate.sh
