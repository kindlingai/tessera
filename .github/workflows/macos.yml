name: macOS

# The Metal backend. Pull requests run clippy, the platform table and
# a compile of every planned kernel.
# Pushes to main and the daily run add the workspace tests. The daily
# run also keeps main's build cache current for pull requests.
on:
  workflow_call:
    inputs:
      light:
        type: boolean
        default: false
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.152
      - run: cargo clippy --workspace --all-targets
      - if: ${{ !inputs.light }}
        run: cargo nextest run --workspace --profile ci
      - run: cargo nextest run -p tessera-linear --test platforms_test --profile ci --no-capture
      - run: cargo nextest run -p tessera-models --test kernels_test --profile ci --no-capture
