name: PR body

# Squash merges copy the PR body into the commit message.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

concurrency:
  group: pr-body-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coauthors:
    # No Co-Authored-By lines crediting AI tools.
    if: github.event.pull_request.draft != true
    # An orble runner for this org's branches. A fork's code runs on
    # a hosted runner instead.
    runs-on: ${{ (github.event.pull_request == null || github.event.pull_request.head.repo.owner.login == 'kindlingai') && 'orble-1' || 'ubuntu-slim' }}
    steps:
      - uses: actions/checkout@v4
      - env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$BODY" > "$RUNNER_TEMP/body.txt"
          tools/scripts/check-coauthors.sh --message "$RUNNER_TEMP/body.txt"
