name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  commits:
    # No Co-Authored-By lines crediting AI tools.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: github.event_name == 'pull_request'
        run: >-
          tools/scripts/check-coauthors.sh
          ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
      - if: github.event_name == 'push'
        run: tools/scripts/check-coauthors.sh ${{ github.event.before }}..${{ github.sha }}

  lint:
    # Code-shape rules (tools/lint) and formatting.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
      - run: cargo fmt --all --check
      # Unused dependencies. It does not read dev-dependencies.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete@0.9.2
      - run: cargo machete
      # The report job renders this JSON into the PR comment.
      - run: mkdir -p "$RUNNER_TEMP/checks" && cargo run -q -p tessera-lint -- --json "$RUNNER_TEMP/checks/lint.json"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-lint
          path: ${{ runner.temp }}/checks/lint.json

  linux:
    # CPU and CUDA host code. The CUDA driver loads at runtime.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo test --workspace --all-features --no-fail-fast

  features:
    # Builds with no GPU backend and with each one alone, so
    # code that only some backends use fails as dead code.
    name: features (${{ matrix.features || 'none' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ['', cuda, rocm]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: features
      - run: cargo clippy --workspace --all-targets --features "${{ matrix.features }}"

  macos:
    # The Metal backend.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace --no-fail-fast
      - run: cargo test -p linear --test platforms_test -- --nocapture

  similarity:
    # Near-copies of code (tools/simcheck), compared by embeddings,
    # and allow.toml pairs that allow nothing.
    runs-on: ubuntu-latest
    env:
      SIMCHECK: cargo run -q --release --manifest-path tools/simcheck/Cargo.toml --
      HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      # Full history, so new files count from the base branch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: simcheck
          workspaces: tools/simcheck
          # The job fails on near-copies. Keep the build anyway.
          cache-on-failure: true
      - run: cargo fmt --manifest-path tools/simcheck/Cargo.toml --check
      - run: cargo clippy --manifest-path tools/simcheck/Cargo.toml --all-targets
      - run: cargo test --manifest-path tools/simcheck/Cargo.toml
      # The checkpoint's text tower, pinned in tools/simcheck/src/fetch.rs.
      - id: model
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/eg2-text
          key: eg2-text-914f7f89142e33e77833254d9c9b90c3cef7303b
      - if: steps.model.outputs.cache-hit != 'true'
        run: $SIMCHECK fetch "$RUNNER_TEMP/eg2-text"
      - if: steps.model.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/eg2-text
          key: eg2-text-914f7f89142e33e77833254d9c9b90c3cef7303b
      # Embeddings keyed by window text. Each run saves a fresh copy.
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/simcheck.bin
          key: simcheck-${{ github.run_id }}
          restore-keys: simcheck-
      # On a pull request, new files that lean elsewhere get a note.
      - run: >
          mkdir -p "$RUNNER_TEMP/checks" &&
          $SIMCHECK check "$RUNNER_TEMP/eg2-text" "$RUNNER_TEMP/simcheck.bin" "$RUNNER_TEMP/checks/simcheck.json"
          ${{ github.base_ref && format('origin/{0}', github.base_ref) || '' }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-simcheck
          path: ${{ runner.temp }}/checks/simcheck.json
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/simcheck.bin
          key: simcheck-${{ github.run_id }}

  style:
    # Comment and prose rules (tools/style) on a PR's added lines. The job
    # fails on any hit, and does nothing on pushes, so `success` can need it.
    runs-on: ubuntu-latest
    env:
      PULL: ${{ github.event_name == 'pull_request' }}
      BASE: ${{ github.event.pull_request.base.sha }}
      HEAD: ${{ github.event.pull_request.head.sha }}
      STYLE: cargo run -q --release -p tessera-style --
    steps:
      - if: env.PULL == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD }}
          fetch-depth: 0
      - if: env.PULL == 'true'
        uses: dtolnay/rust-toolchain@1.99.1
      - if: env.PULL == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: style
      # spaCy's small English pipeline, pinned in tools/style/src/fetch.rs.
      - if: env.PULL == 'true'
        id: spacy
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/spacy
          key: spacy-en-core-web-sm-8fb6f8155286360bf5486fe399e2738d1df7ded2
      - if: env.PULL == 'true' && steps.spacy.outputs.cache-hit != 'true'
        run: $STYLE fetch "$RUNNER_TEMP/spacy"
      - if: env.PULL == 'true' && steps.spacy.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/spacy
          key: spacy-en-core-web-sm-8fb6f8155286360bf5486fe399e2738d1df7ded2
      - if: env.PULL == 'true'
        run: >
          mkdir -p "$RUNNER_TEMP/checks" &&
          $STYLE diff "$RUNNER_TEMP/spacy" "$BASE" "$HEAD" "$RUNNER_TEMP/checks/style.json"
      - if: always() && env.PULL == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: checks-style
          path: ${{ runner.temp }}/checks/style.json

  report:
    # One PR comment for lint, similarity and style (tools/check).
    if: always() && github.event_name == 'pull_request'
    needs: [lint, similarity, style]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD }}
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
      - uses: actions/download-artifact@v4
        with:
          pattern: checks-*
          path: ${{ runner.temp }}/checks
          merge-multiple: true
      # Render the reports that exist. A job can fail before writing one.
      - run: |
          set -- "$RUNNER_TEMP"/checks/*.json
          [ -e "$1" ] || exit 0
          cargo run -q -p tessera-check -- render "$@" --markdown "$RUNNER_TEMP/checks.md" \
            "https://github.com/${{ github.repository }}/blob/$HEAD"
      # Fork PRs get a read-only token and cannot comment.
      - continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: tools/scripts/pr-comment.sh "$RUNNER_TEMP/checks.md"

  platforms:
    # The platform table against nvcc, cuobjdump and clang's amdgcn
    # backend, with no GPU needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: platforms
      - name: Install nvcc, cuobjdump, nvdisasm and clang
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -q
          sudo apt-get install -y -q cuda-nvcc-13-0 cuda-cuobjdump-13-0 cuda-nvdisasm-13-0 clang
          echo /usr/local/cuda-13.0/bin >> "$GITHUB_PATH"
      - run: which nvcc cuobjdump nvdisasm clang++
      - run: cargo test -p linear --test platforms_test -- --nocapture

  success:
    # The one check to require: every job above passed, and no
    # human step is pending.
    if: always()
    needs: [commits, lint, linux, features, macos, similarity, platforms, style]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
      # Protected files and fork settings: see protected.yml.
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
      - if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: tools/scripts/pr-gate.sh
