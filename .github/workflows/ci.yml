name: CI

on:
  push:
    branches: [main]
  # Jobs skip on a draft. Marking it ready starts a full run.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  # Tested images by tree, and the layer cache of the docker job.
  CI_IMAGE: ghcr.io/${{ github.repository }}-ci

jobs:
  commits:
    # No Co-Authored-By lines crediting AI tools.
    if: github.event.pull_request.draft != true
    runs-on: orble-1
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: tools/scripts/check-coauthors.sh "$BASE..$HEAD"
      - if: failure() && github.event_name == 'merge_group'
        uses: ./.github/actions/cancel-on-failure

  # In a merge group the tier gate runs before the build jobs, so a
  # group that conflicts with a ranked PR fails at once. A pull request
  # runs the gate in success, so its builds do not wait.
  # The job runs on every event and skips its steps instead. A skipped
  # job here would skip every job that needs `changes`.
  tiers:
    if: github.event.pull_request.draft != true
    runs-on: orble-1
    steps:
      - if: github.event_name == 'merge_group'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - if: github.event_name == 'merge_group'
        uses: ./.github/actions/tier-gate

  changes:
    # Whether anything changed outside Markdown, lint code, maps and lint.toml.
    # The build jobs skip when nothing did, and when a merge group holds
    # the tree its pull request already passed.
    needs: tiers
    if: ${{ !cancelled() && needs.tiers.result != 'failure' && github.event.pull_request.draft != true }}
    runs-on: orble-1
    outputs:
      build: ${{ steps.reuse.outputs.build }}
      reuse: ${{ steps.reuse.outputs.reuse }}
      macos: ${{ steps.reuse.outputs.macos }}
      docker: ${{ steps.image.outputs.docker || steps.reuse.outputs.docker }}
      mounts: ${{ steps.mounts.outputs.key }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A push with no earlier commit to compare builds everything.
      - id: paths
        env:
          # Files that can change the Docker image or the Kubernetes example.
          DOCKER_PATHS: '^(Dockerfile|\.dockerignore|deploy/|tools/scripts/image-libs\.sh$|Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.github/workflows/ci\.yml$)'
          SOURCE_PATHS: '^(engine|frontend|examples|tools)/'
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          build=true
          docker=true
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE...$HEAD" > "$RUNNER_TEMP/changed"
            build=$(tools/scripts/build-needed.sh < "$RUNNER_TEMP/changed")
            docker=false
            if grep -qE "$DOCKER_PATHS" "$RUNNER_TEMP/changed"; then docker=true; fi
            # Crate sources, which the image compiles.
            if grep -E "$SOURCE_PATHS" "$RUNNER_TEMP/changed" | grep -qvE '^tools/scripts/|\.md$'; then docker=true; fi
          fi
          # Pushes to main build the image for any change.
          [ "$GITHUB_EVENT_NAME" != push ] || docker=$build
          printf 'build=%s\ndocker=%s\n' "$build" "$docker" | tee -a "$GITHUB_OUTPUT"
      # A push to main runs the full macOS job when its merge group did
      # not, so a reused landing still gets those tests.
      - id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          BUILD: ${{ steps.paths.outputs.build }}
          DOCKER: ${{ steps.paths.outputs.docker }}
        run: |
          reuse=false
          macos=true
          if [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            reuse=$(tools/scripts/queue-reuse.sh)
          fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            ran=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=macos%20%2F%20build" \
              --jq '[.check_runs[] | select(.conclusion == "success")] | length')
            [ "$ran" -eq 0 ] || macos=false
          fi
          [ "$reuse" = false ] || BUILD=false
          [ "$reuse" = false ] || DOCKER=false
          printf 'build=%s\nreuse=%s\nmacos=%s\ndocker=%s\n' "$BUILD" "$reuse" "$macos" "$DOCKER" | tee -a "$GITHUB_OUTPUT"
      # The docker job's Cargo cache mounts change only with these files.
      - id: mounts
        run: echo "key=${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'Dockerfile') }}" | tee -a "$GITHUB_OUTPUT"
      # A push to main skips the image when its merge group built and
      # checked the same tree, and main holds the cache mounts for it.
      - if: github.event_name == 'push' && steps.reuse.outputs.docker == 'true'
        id: mounts-cuda
        uses: actions/cache/restore@v4
        with:
          path: cargo-mounts
          key: docker-mounts-cuda-${{ steps.mounts.outputs.key }}
          lookup-only: true
      - if: github.event_name == 'push' && steps.reuse.outputs.docker == 'true'
        id: mounts-rocm
        uses: actions/cache/restore@v4
        with:
          path: cargo-mounts
          key: docker-mounts-rocm-${{ steps.mounts.outputs.key }}
          lookup-only: true
      - if: >
          github.event_name == 'push' &&
          steps.mounts-cuda.outputs.cache-hit == 'true' &&
          steps.mounts-rocm.outputs.cache-hit == 'true'
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker=true
          if [ "$(tools/scripts/image-built.sh cuda rocm)" = true ]; then docker=false; fi
          echo "docker=$docker" | tee -a "$GITHUB_OUTPUT"

  lint:
    # Code-shape rules and task maps (stickler lint), and formatting.
    needs: changes
    if: needs.changes.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    # Labels new size limit breaches for review.
    permissions:
      contents: read
      pull-requests: write
      actions: write
    outputs:
      review: ${{ steps.gate.outputs.review }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      # Unused dependencies. It does not read dev-dependencies.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete@0.9.2
      - run: cargo machete
      # The report job renders this JSON into the PR comment.
      # A new size limit breach on a PR needs a review, not a fix.
      - id: gate
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/checks"
          tools/scripts/lint-gate.sh "$RUNNER_TEMP/checks/lint.json" > "$RUNNER_TEMP/review"
          tee -a "$GITHUB_OUTPUT" < "$RUNNER_TEMP/review"
      # Fork PRs get a read-only token. pr-gate.sh then fails success.
      - if: steps.gate.outputs.review != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REVIEW: ${{ steps.gate.outputs.review }}
        run: echo "$REVIEW" | tr ' ' '\n' | tools/scripts/protected-label.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-lint
          path: ${{ runner.temp }}/checks/lint.json
      - if: failure() && github.event_name == 'merge_group'
        uses: ./.github/actions/cancel-on-failure

  linux:
    # CPU and CUDA host code. The CUDA driver loads at runtime.
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.152
      - run: cargo clippy --workspace --all-targets --all-features
      # Profiles and test groups live in .config/nextest.toml.
      - run: cargo nextest run --workspace --all-features --profile ci
      # The report job renders failed and slow tests into the PR comment.
      - if: always() && hashFiles('target/nextest/ci/junit.xml') != ''
        run: >
          mkdir -p "$RUNNER_TEMP/checks" &&
          tools/scripts/stickler.sh tests target/nextest/ci/junit.xml "$RUNNER_TEMP/checks/tests.json"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-tests
          path: ${{ runner.temp }}/checks/tests.json
          if-no-files-found: ignore
      - if: failure() && github.event_name == 'merge_group'
        uses: ./.github/actions/cancel-on-failure

  features:
    # Builds with no GPU backend and with each one alone, so
    # code that only some backends use fails as dead code.
    name: features (${{ matrix.features || 'none' }})
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        features: ['', cuda, rocm]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: features
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --features "${{ matrix.features }}"
      # The merged crates.io crates must build with each backend too.
      - run: cargo run -q -p tessera-publish
      - run: cargo clippy --manifest-path target/publish/Cargo.toml --workspace --features "${{ matrix.features }}"
      - if: matrix.features == ''
        run: cargo package --manifest-path target/publish/Cargo.toml --workspace --allow-dirty --no-verify
      # One binary holds every crate, so unused `pub` items fail.
      # Linux without a backend has no GPU, so skip it there.
      - if: matrix.features != ''
        run: cargo run -q -p tessera-publish -- --lint
      - if: matrix.features != ''
        run: cargo check --manifest-path target/publish-lint/Cargo.toml --workspace --tests --features "${{ matrix.features }}"
      - if: failure() && github.event_name == 'merge_group'
        uses: ./.github/actions/cancel-on-failure

  grammar:
    # The llguidance guide, behind its off-by-default feature.
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: grammar
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy -p tessera-grammar --all-targets --features llguidance
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.152
      - run: cargo nextest run -p tessera-grammar --features llguidance --profile ci
      - if: failure() && github.event_name == 'merge_group'
        uses: ./.github/actions/cancel-on-failure

  macos:
    # Light on pull requests. The merge queue skips it, because macOS
    # runners are scarce. A push to main runs the full job when its merge
    # group did not.
    needs: changes
    if: >
      github.event_name != 'merge_group' &&
      needs.changes.outputs.build == 'true' && needs.changes.outputs.macos == 'true'
    uses: ./.github/workflows/macos.yml
    with:
      light: ${{ github.event_name == 'pull_request' }}

  arm64:
    # The aarch64 host paths (SIMD, JIT, proxy) that the x86_64 jobs do
    # not build, and the Metal crates checked for macOS, so the merge
    # queue does not wait for a macOS runner. Their build scripts do
    # not compile C, so the job does not need a macOS SDK.
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: arm64
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --target aarch64-apple-darwin -p tessera-gpukit -p tessera-platform --all-targets
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.152
      - run: cargo nextest run --workspace --profile ci
      - if: failure() && github.event_name == 'merge_group'
        uses: ./.github/actions/cancel-on-failure

  similarity:
    # Near-copies of code (stickler simcheck), compared by embeddings,
    # and allow.toml pairs that allow nothing. The pull request ran it,
    # so the merge queue skips it.
    if: github.event_name != 'merge_group' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    env:
      SIMCHECK: tools/scripts/stickler.sh simcheck
      HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      # Full history, so new files count from the base branch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD }}
          fetch-depth: 0
      # The model revision lives in stickler, so its version keys the cache.
      - id: pin
        run: echo "stickler=$(sed -n 's/^stickler\.version = "\(.*\)"$/\1/p' lint.toml)" >> "$GITHUB_OUTPUT"
      - id: model
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/eg2-text
          key: eg2-text-stickler-${{ steps.pin.outputs.stickler }}
      - if: steps.model.outputs.cache-hit != 'true'
        run: $SIMCHECK fetch "$RUNNER_TEMP/eg2-text"
      - if: steps.model.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/eg2-text
          key: eg2-text-stickler-${{ steps.pin.outputs.stickler }}
      # Embeddings keyed by window text, in shard files. Each run saves
      # a fresh copy.
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/simcheck
          key: simcheck2-${{ github.run_id }}
          restore-keys: simcheck2-
      # On a pull request, new files that lean elsewhere get a note.
      # Pull requests embed changed files and 300 other windows.
      # Pushes to main only fill the cache, and never fail.
      - run: >
          mkdir -p "$RUNNER_TEMP/checks" &&
          $SIMCHECK check "$RUNNER_TEMP/eg2-text" "$RUNNER_TEMP/simcheck" "$RUNNER_TEMP/checks/simcheck.json"
          ${{ github.base_ref && format('origin/{0} --budget 300', github.base_ref) || '--warm --budget 2000' }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-simcheck
          path: ${{ runner.temp }}/checks/simcheck.json
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/simcheck
          key: simcheck2-${{ github.run_id }}
      # Each save is a new key. Older keys on this ref only take space
      # and push other caches past the repository limit. A fork's token
      # cannot delete caches.
      - if: >
          always() && (github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: simcheck2-${{ github.run_id }}
        # Nothing goes unless this run's copy saved.
        run: >
          gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key simcheck2- --limit 100
          --json id,key --jq "if any(.[]; .key == \"$KEEP\") then .[] | select(.key != \"$KEEP\") | .id else empty end" |
          xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY"
      - if: failure() && github.event_name == 'merge_group'
        uses: ./.github/actions/cancel-on-failure

  style:
    # Comment and prose rules (stickler style) on a PR's added lines. The job
    # fails on any hit, and does nothing on pushes, so `success` can need it.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    env:
      PULL: ${{ github.event_name == 'pull_request' }}
      BASE: ${{ github.event.pull_request.base.sha }}
      HEAD: ${{ github.event.pull_request.head.sha }}
      STYLE: tools/scripts/stickler.sh style
    steps:
      - if: env.PULL == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD }}
          fetch-depth: 0
      # The pipeline revision lives in stickler, so its version keys the cache.
      - if: env.PULL == 'true'
        id: pin
        run: echo "stickler=$(sed -n 's/^stickler\.version = "\(.*\)"$/\1/p' lint.toml)" >> "$GITHUB_OUTPUT"
      - if: env.PULL == 'true'
        id: spacy
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/spacy
          key: spacy-stickler-${{ steps.pin.outputs.stickler }}
      - if: env.PULL == 'true' && steps.spacy.outputs.cache-hit != 'true'
        run: $STYLE fetch "$RUNNER_TEMP/spacy"
      - if: env.PULL == 'true' && steps.spacy.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/spacy
          key: spacy-stickler-${{ steps.pin.outputs.stickler }}
      - if: env.PULL == 'true'
        run: >
          mkdir -p "$RUNNER_TEMP/checks" &&
          $STYLE diff "$RUNNER_TEMP/spacy" "$BASE" "$HEAD" "$RUNNER_TEMP/checks/style.json"
      - if: always() && env.PULL == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: checks-style
          path: ${{ runner.temp }}/checks/style.json
      - if: failure() && github.event_name == 'merge_group'
        uses: ./.github/actions/cancel-on-failure

  report:
    # One PR comment for lint, similarity, style and tests (stickler).
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.draft != true
    needs: [lint, linux, similarity, style]
    runs-on: orble-1
    permissions:
      contents: read
      pull-requests: write
    env:
      HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD }}
      - uses: actions/download-artifact@v4
        with:
          pattern: checks-*
          path: ${{ runner.temp }}/checks
          merge-multiple: true
      # Render the reports that exist. A job can fail before writing one.
      - run: |
          set -- "$RUNNER_TEMP"/checks/*.json
          [ -e "$1" ] || exit 0
          tools/scripts/stickler.sh render "$@" --markdown "$RUNNER_TEMP/checks.md" \
            "https://github.com/${{ github.repository }}/blob/$HEAD"
      # Fork PRs get a read-only token and cannot comment.
      - continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: tools/scripts/pr-comment.sh "$RUNNER_TEMP/checks.md"

  platforms:
    # The platform table and every planned kernel against nvcc,
    # cuobjdump and clang's amdgcn backend, without a GPU.
    needs: changes
    if: needs.changes.outputs.build == 'true'
    # CUDA 13.0 packages target 24.04. Newer glibc breaks nvcc.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: platforms
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install nvcc, cuobjdump, nvdisasm and clang
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -q
          sudo apt-get install -y -q cuda-nvcc-13-0 cuda-cuobjdump-13-0 cuda-nvdisasm-13-0 clang
          echo /usr/local/cuda-13.0/bin >> "$GITHUB_PATH"
      - run: which nvcc cuobjdump nvdisasm clang++
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.152
      - run: cargo nextest run -p tessera-linear --test platforms_test --profile ci --no-capture
      - run: cargo nextest run -p tessera-models --test kernels_test --profile ci --no-capture
      - if: failure() && github.event_name == 'merge_group'
        uses: ./.github/actions/cancel-on-failure

  docker:
    # Each image runs without a GPU and finds the libraries tesserax
    # opens. Each Kubernetes example matches its schemas.
    name: docker (${{ matrix.backend }})
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: cuda
            libs: libnvrtc.so.13
          - backend: rocm
            libs: libamdhip64.so.7 libhiprtc.so.7
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - run: >
          kubectl kustomize "deploy/k8s/${{ matrix.backend }}" |
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -
      - uses: docker/setup-buildx-action@v3
      # A fork's token may not read the registry. The build then runs
      # without the layer cache.
      - uses: docker/login-action@v3
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # The Cargo registry and target/ cache mounts, from main. Only
      # pushes save them, so pull requests do not fill the cache. The key
      # changes only with the files that change the dependencies, so a
      # push saves it once and later pushes may skip the image.
      - if: github.event_name == 'push'
        id: mounts
        uses: actions/cache@v4
        with:
          path: cargo-mounts
          key: docker-mounts-${{ matrix.backend }}-${{ needs.changes.outputs.mounts }}
          restore-keys: docker-mounts-${{ matrix.backend }}-
      - if: github.event_name != 'push'
        uses: actions/cache/restore@v4
        with:
          path: cargo-mounts
          key: docker-mounts-${{ matrix.backend }}-${{ needs.changes.outputs.mounts }}
          restore-keys: docker-mounts-${{ matrix.backend }}-
      - uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            {
              "cargo-mounts/registry": "/usr/local/cargo/registry",
              "cargo-mounts/target": "/src/target"
            }
          skip-extraction: ${{ github.event_name != 'push' || steps.mounts.outputs.cache-hit == 'true' }}
      # Layers from earlier runs, so an unchanged tree skips the build.
      # The registry cache is not tied to a branch, so the merge queue
      # and main use the same cache. Pull requests do not write to the registry.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tesserax:ci
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: BACKEND=${{ matrix.backend }}
          cache-from: type=registry,ref=${{ env.CI_IMAGE }}:cache-${{ matrix.backend }}
          cache-to: >-
            ${{ github.event_name != 'pull_request' &&
            format('type=registry,ref={0}:cache-{1},mode=max,ignore-error=true', env.CI_IMAGE, matrix.backend) || '' }}
      - run: docker image ls tesserax:ci --format 'image size {{.Size}}'
      - run: >
          docker run --rm -v "$PWD/tools/scripts:/scripts:ro" --entrypoint /bin/sh
          tesserax:ci /scripts/image-libs.sh ${{ matrix.libs }}
      # With no verb, tesserax prints its usage and exits 2.
      - run: |
          code=0
          docker run --rm tesserax:ci 2> "$RUNNER_TEMP/usage" || code=$?
          cat "$RUNNER_TEMP/usage"
          [ "$code" -eq 2 ]
          grep -q '^usage: tesserax' "$RUNNER_TEMP/usage"
      # The checked image, tagged by tree. A push to main with the same
      # tree then skips the build: see tools/scripts/image-built.sh. A
      # failed push only means that later build runs.
      - if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          TAG: ${{ env.CI_IMAGE }}:${{ matrix.backend }}
        run: |
          tag="$TAG-$(git rev-parse 'HEAD^{tree}')"
          docker tag tesserax:ci "$tag"
          docker push "$tag"
      - if: failure() && github.event_name == 'merge_group'
        uses: ./.github/actions/cancel-on-failure

  success:
    # The one check to require: every job above passed or was skipped
    # by `changes`, and no human step is pending. Skipped on a draft.
    if: always() && github.event.pull_request.draft != true
    needs: [tiers, changes, commits, lint, linux, features, grammar, macos, arm64, similarity, platforms, docker, style]
    # An orble runner, so success does not wait for one of the hosted
    # runners that the build jobs fill.
    runs-on: orble-1
    steps:
      # Full history without file contents, for merge bases. Test
      # merges against ranked PRs fetch the contents they read.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      # Skips come only from `changes`, so it must pass itself. A job
      # left without a hosted runner counts as skipped, so a runner
      # outage does not remove a merge queue entry. On main a newer push
      # cancels the run, so a cancel there is not a failure.
      - env:
          GH_TOKEN: ${{ github.token }}
          CHANGES: ${{ needs.changes.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "changes: $CHANGES, job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
            success | skipped) ;;
            # A needed job left without a runner can show as abandoned.
            cancelled | abandoned) cancelled=1 ;;
            *) exit 1 ;;
            esac
          done
          if [ -n "$cancelled" ] && [ "$EVENT" = push ]; then
            echo "Jobs were cancelled on main, usually by a newer push."
            exit 0
          fi
          [ "$CHANGES" = success ] || exit 1
          [ -z "$cancelled" ] || tools/scripts/runner-missing.sh
      # Protected files and fork settings: see protected.yml.
      - if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REVIEW: ${{ needs.lint.outputs.review }}
        run: tools/scripts/pr-gate.sh
      - if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: tools/scripts/protected-ran.sh
      # Conflicts with PRs ranked by label: see tiers.yml and the
      # tiers job above.
      - if: github.event_name == 'pull_request'
        uses: ./.github/actions/tier-gate
