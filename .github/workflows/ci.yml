name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# Each push to main runs to the end, so its macOS job is never dropped.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  commits:
    # No Co-Authored-By lines crediting AI tools.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: tools/scripts/check-coauthors.sh "$BASE..$HEAD"

  changes:
    # Whether anything changed outside Markdown, lint code and lint.toml.
    # The build jobs skip when nothing did, and when a merge group holds
    # the tree its pull request already passed.
    runs-on: ubuntu-slim
    outputs:
      build: ${{ steps.reuse.outputs.build }}
      reuse: ${{ steps.reuse.outputs.reuse }}
      macos: ${{ steps.reuse.outputs.macos }}
      docker: ${{ steps.reuse.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A push with no earlier commit to compare builds everything.
      - id: paths
        env:
          # Files that can change the Docker image or the Kubernetes example.
          DOCKER_PATHS: '^(Dockerfile|\.dockerignore|deploy/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.github/workflows/ci\.yml$)'
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          build=true
          docker=true
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE...$HEAD" > "$RUNNER_TEMP/changed"
            build=$(tools/scripts/build-needed.sh < "$RUNNER_TEMP/changed")
            docker=false
            if grep -qE "$DOCKER_PATHS" "$RUNNER_TEMP/changed"; then docker=true; fi
          fi
          # Pushes to main build the image for any change.
          [ "$GITHUB_EVENT_NAME" != push ] || docker=$build
          printf 'build=%s\ndocker=%s\n' "$build" "$docker" | tee -a "$GITHUB_OUTPUT"
      # A push to main runs the full macOS job when its merge group did
      # not, so a reused landing still gets those tests.
      - id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          BUILD: ${{ steps.paths.outputs.build }}
          DOCKER: ${{ steps.paths.outputs.docker }}
        run: |
          reuse=false
          macos=true
          if [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            reuse=$(tools/scripts/queue-reuse.sh)
          fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            ran=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=macos%20%2F%20build" \
              --jq '[.check_runs[] | select(.conclusion == "success")] | length')
            [ "$ran" -eq 0 ] || macos=false
          fi
          [ "$reuse" = false ] || BUILD=false
          [ "$reuse" = false ] || DOCKER=false
          printf 'build=%s\nreuse=%s\nmacos=%s\ndocker=%s\n' "$BUILD" "$reuse" "$macos" "$DOCKER" | tee -a "$GITHUB_OUTPUT"

  lint:
    # Code-shape rules (tools/lint), their tests, and formatting.
    needs: changes
    if: needs.changes.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
      - run: cargo fmt --all --check
      # The linux job skips when only lint changes, so lint tests run here.
      - run: cargo clippy -p tessera-lint --all-targets
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.152
      - run: cargo nextest run -p tessera-lint --profile ci
      # Unused dependencies. It does not read dev-dependencies.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete@0.9.2
      - run: cargo machete
      # The report job renders this JSON into the PR comment.
      - run: mkdir -p "$RUNNER_TEMP/checks" && cargo run -q -p tessera-lint -- --json "$RUNNER_TEMP/checks/lint.json"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-lint
          path: ${{ runner.temp }}/checks/lint.json

  linux:
    # CPU and CUDA host code. The CUDA driver loads at runtime.
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.152
      - run: cargo clippy --workspace --all-targets --all-features
      # Profiles and test groups live in .config/nextest.toml.
      - run: cargo nextest run --workspace --all-features --profile ci
      # The report job renders failed and slow tests into the PR comment.
      - if: always() && hashFiles('target/nextest/ci/junit.xml') != ''
        run: >
          mkdir -p "$RUNNER_TEMP/checks" &&
          cargo run -q -p tessera-check -- tests target/nextest/ci/junit.xml "$RUNNER_TEMP/checks/tests.json"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-tests
          path: ${{ runner.temp }}/checks/tests.json
          if-no-files-found: ignore

  features:
    # Builds with no GPU backend and with each one alone, so
    # code that only some backends use fails as dead code.
    name: features (${{ matrix.features || 'none' }})
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ['', cuda, rocm]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: features
      - run: cargo clippy --workspace --all-targets --features "${{ matrix.features }}"
      # The merged crates.io crates must build with each backend too.
      - run: cargo run -q -p tessera-publish
      - run: cargo clippy --manifest-path target/publish/Cargo.toml --workspace --features "${{ matrix.features }}"
      - if: matrix.features == ''
        run: cargo package --manifest-path target/publish/Cargo.toml --workspace --allow-dirty --no-verify

  grammar:
    # The llguidance guide, behind its off-by-default feature.
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: grammar
      - run: cargo clippy -p tessera-grammar --all-targets --features llguidance
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.152
      - run: cargo nextest run -p tessera-grammar --features llguidance --profile ci

  macos:
    # Light on pull requests. The merge queue skips it, because macOS
    # runners are scarce. A push to main runs the full job when its merge
    # group did not.
    needs: changes
    if: >
      github.event_name != 'merge_group' &&
      needs.changes.outputs.build == 'true' && needs.changes.outputs.macos == 'true'
    uses: ./.github/workflows/macos.yml
    with:
      light: ${{ github.event_name == 'pull_request' }}

  arm64:
    # The aarch64 host paths (SIMD, JIT, proxy) that the x86_64 jobs do
    # not build, and the Metal crates checked for macOS, so the merge
    # queue does not wait for a macOS runner. Their build scripts need
    # no C toolchain, so no macOS SDK is needed.
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: arm64
      - run: cargo clippy --target aarch64-apple-darwin -p tessera-gpukit -p tessera-platform --all-targets
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.152
      - run: cargo nextest run --workspace --profile ci

  similarity:
    # Near-copies of code (tools/simcheck), compared by embeddings,
    # and allow.toml pairs that allow nothing. The pull request ran it,
    # so the merge queue skips it.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    env:
      SIMCHECK: cargo run -q --release --manifest-path tools/simcheck/Cargo.toml --
      HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      # Full history, so new files count from the base branch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: simcheck
          workspaces: tools/simcheck
          # The job fails on near-copies. Keep the build anyway.
          cache-on-failure: true
      # Names a stale base when only files outside this PR fail.
      - env:
          FMT_BASE: origin/${{ github.base_ref || 'main' }}
        run: tools/scripts/fmt-check.sh --manifest-path tools/simcheck/Cargo.toml
      - run: cargo clippy --manifest-path tools/simcheck/Cargo.toml --all-targets
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.152
      # A separate workspace with its own .config/nextest.toml.
      - run: cargo nextest run --manifest-path tools/simcheck/Cargo.toml
      # The checkpoint's text tower, pinned in tools/simcheck/src/fetch.rs.
      - id: model
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/eg2-text
          key: eg2-text-914f7f89142e33e77833254d9c9b90c3cef7303b
      - if: steps.model.outputs.cache-hit != 'true'
        run: $SIMCHECK fetch "$RUNNER_TEMP/eg2-text"
      - if: steps.model.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/eg2-text
          key: eg2-text-914f7f89142e33e77833254d9c9b90c3cef7303b
      # The older single-file cache. simcheck reads it when the shard
      # folder fails to restore, and saves it as shards.
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/simcheck.bin
          key: simcheck-${{ github.run_id }}
          restore-keys: simcheck-
      # Embeddings keyed by window text, in shard files. Each run saves
      # a fresh copy.
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/simcheck
          key: simcheck2-${{ github.run_id }}
          restore-keys: simcheck2-
      # On a pull request, new files that lean elsewhere get a note.
      # Pull requests embed changed files and 300 other windows.
      # Pushes to main only fill the cache, and never fail.
      - run: >
          mkdir -p "$RUNNER_TEMP/checks" &&
          $SIMCHECK check "$RUNNER_TEMP/eg2-text" "$RUNNER_TEMP/simcheck" "$RUNNER_TEMP/checks/simcheck.json"
          ${{ github.base_ref && format('origin/{0} --budget 300', github.base_ref) || '--warm --budget 2000' }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-simcheck
          path: ${{ runner.temp }}/checks/simcheck.json
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/simcheck
          key: simcheck2-${{ github.run_id }}

  style:
    # Comment and prose rules (tools/style) on a PR's added lines. The job
    # fails on any hit, and does nothing on pushes, so `success` can need it.
    runs-on: ubuntu-latest
    env:
      PULL: ${{ github.event_name == 'pull_request' }}
      BASE: ${{ github.event.pull_request.base.sha }}
      HEAD: ${{ github.event.pull_request.head.sha }}
      STYLE: cargo run -q --release -p tessera-style --
    steps:
      - if: env.PULL == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD }}
          fetch-depth: 0
      - if: env.PULL == 'true'
        uses: dtolnay/rust-toolchain@1.99.1
      - if: env.PULL == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: style
      # spaCy's small English pipeline, pinned in tools/style/src/fetch.rs.
      - if: env.PULL == 'true'
        id: spacy
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/spacy
          key: spacy-en-core-web-sm-8fb6f8155286360bf5486fe399e2738d1df7ded2
      - if: env.PULL == 'true' && steps.spacy.outputs.cache-hit != 'true'
        run: $STYLE fetch "$RUNNER_TEMP/spacy"
      - if: env.PULL == 'true' && steps.spacy.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/spacy
          key: spacy-en-core-web-sm-8fb6f8155286360bf5486fe399e2738d1df7ded2
      - if: env.PULL == 'true'
        run: >
          mkdir -p "$RUNNER_TEMP/checks" &&
          $STYLE diff "$RUNNER_TEMP/spacy" "$BASE" "$HEAD" "$RUNNER_TEMP/checks/style.json"
      - if: always() && env.PULL == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: checks-style
          path: ${{ runner.temp }}/checks/style.json

  report:
    # One PR comment for lint, similarity, style and tests (tools/check).
    if: always() && github.event_name == 'pull_request'
    needs: [lint, linux, similarity, style]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD }}
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
      - uses: actions/download-artifact@v4
        with:
          pattern: checks-*
          path: ${{ runner.temp }}/checks
          merge-multiple: true
      # Render the reports that exist. A job can fail before writing one.
      - run: |
          set -- "$RUNNER_TEMP"/checks/*.json
          [ -e "$1" ] || exit 0
          cargo run -q -p tessera-check -- render "$@" --markdown "$RUNNER_TEMP/checks.md" \
            "https://github.com/${{ github.repository }}/blob/$HEAD"
      # Fork PRs get a read-only token and cannot comment.
      - continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: tools/scripts/pr-comment.sh "$RUNNER_TEMP/checks.md"

  platforms:
    # The platform table against nvcc, cuobjdump and clang's amdgcn
    # backend, without a GPU.
    needs: changes
    if: needs.changes.outputs.build == 'true'
    # CUDA 13.0 packages target 24.04. Newer glibc breaks nvcc.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: platforms
      - name: Install nvcc, cuobjdump, nvdisasm and clang
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -q
          sudo apt-get install -y -q cuda-nvcc-13-0 cuda-cuobjdump-13-0 cuda-nvdisasm-13-0 clang
          echo /usr/local/cuda-13.0/bin >> "$GITHUB_PATH"
      - run: which nvcc cuobjdump nvdisasm clang++
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.152
      - run: cargo nextest run -p tessera-linear --test platforms_test --profile ci --no-capture

  docker:
    # The CUDA image runs without a GPU, and the Kubernetes example
    # matches its schemas.
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >
          docker run --rm -v "$PWD/deploy:/deploy:ro" ghcr.io/yannh/kubeconform:v0.6.7
          -strict -summary /deploy/k8s
      - uses: docker/setup-buildx-action@v3
      # Layers from earlier runs, so an unchanged tree skips the build.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tesserax:ci
          cache-from: type=gha,scope=docker
          cache-to: type=gha,scope=docker,mode=max
      # With no verb, tesserax prints its usage and exits 2.
      - run: |
          code=0
          docker run --rm tesserax:ci 2> "$RUNNER_TEMP/usage" || code=$?
          cat "$RUNNER_TEMP/usage"
          [ "$code" -eq 2 ]
          grep -q '^usage: tesserax' "$RUNNER_TEMP/usage"

  success:
    # The one check to require: every job above passed or was skipped
    # by `changes`, and no human step is pending.
    if: always()
    needs: [changes, commits, lint, linux, features, grammar, macos, arm64, similarity, platforms, docker, style]
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      # Skips come only from `changes`, so it must pass itself. A job
      # left without a hosted runner counts as skipped, so a runner
      # outage does not remove a merge queue entry.
      - env:
          GH_TOKEN: ${{ github.token }}
          CHANGES: ${{ needs.changes.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "changes: $CHANGES, job results: $RESULTS"
          [ "$CHANGES" = success ] || exit 1
          for r in $RESULTS; do
            case "$r" in
            success | skipped) ;;
            # A needed job left without a runner can show as abandoned.
            cancelled | abandoned) cancelled=1 ;;
            *) exit 1 ;;
            esac
          done
          [ -z "$cancelled" ] || tools/scripts/runner-missing.sh
      # Protected files and fork settings: see protected.yml.
      - if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: tools/scripts/pr-gate.sh
      - if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: tools/scripts/protected-ran.sh
