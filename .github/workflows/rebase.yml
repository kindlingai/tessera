name: List rebase

# Rebases a pull request that conflicts with main only in lists:
# `use` lines, `mod` lines and Cargo.toml dependencies. tools/rebase
# decides. Other conflicts get one comment and no push.
# push and pull_request_target run main's copy of this file, its
# scripts and tools/rebase. The build job runs pull request code.
# The plan and push jobs do not.
on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, unlabeled]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true

permissions: {}

concurrency:
  group: list-rebase-${{ github.event.pull_request.number || inputs.pr || 'all' }}

env:
  MAIN: ${{ github.event.repository.default_branch }}
  TOOL: target/debug/tessera-rebase

jobs:
  plan:
    # Lists the pull requests whose conflicts are all list conflicts.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.99.1
      - run: cargo build -q -p tessera-rebase
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: tools/scripts/rebase-list.sh | tee -a "$GITHUB_OUTPUT"

  build:
    # Runs pull request code: build scripts and proc macros. The token
    # reads only and git does not keep it. This job does not get a
    # secret or a cache. The push job checks what this job uploads.
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pull: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: -D warnings
      HEAD: ${{ matrix.pull.head }}
      BASE: ${{ matrix.pull.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git fetch -q origin "$HEAD"
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - run: cargo build -q -p tessera-rebase
      - run: |
          "$TOOL" build "$BASE" "$HEAD" "$RUNNER_TEMP/rebase" "$RUNNER_TEMP/built" --all-features
      - uses: actions/upload-artifact@v4
        with:
          name: list-rebase-${{ matrix.pull.pr }}
          path: ${{ runner.temp }}/built

  push:
    # Does not run pull request code. tessera-rebase plans the rebase again
    # here and takes from the build only the files that had a conflict.
    needs: [plan, build]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        pull: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      # The identity that pushes. With these two secrets a GitHub App
      # pushes, and CI runs on the new head. Without them the workflow
      # token pushes, and GitHub does not start CI for that push.
      APP_ID: ${{ secrets.TIERS_APP_ID }}
      APP_KEY: ${{ secrets.TIERS_APP_PRIVATE_KEY }}
    steps:
      - id: app
        if: env.APP_ID != '' && env.APP_KEY != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ env.APP_ID }}
          private-key: ${{ env.APP_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || github.token }}
      - uses: dtolnay/rust-toolchain@1.99.1
      - run: cargo build -q -p tessera-rebase
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: list-rebase-${{ matrix.pull.pr }}
          path: ${{ runner.temp }}/built
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ matrix.pull.pr }}
          HEAD: ${{ matrix.pull.head }}
          BASE: ${{ matrix.pull.base }}
          BUILT: ${{ runner.temp }}/built
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BOT: ${{ steps.app.outputs.app-slug || 'github-actions' }}
        run: tools/scripts/rebase-push.sh
