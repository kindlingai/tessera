name: Auto rebase

# Rebases a pull request with the priority or landing label that
# conflicts with main, when its commits replay on main and each
# conflict joins list entries: `use` lines, `mod` lines and Cargo.toml
# dependencies. tools/rebase decides. Other conflicts get one comment.
# push and pull_request_target run main's copy of this file, its
# scripts and tools/rebase. The build job runs pull request code in a
# container. The plan and push jobs do not run it.
on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true

permissions: {}

concurrency:
  group: list-rebase-${{ github.event.pull_request.number || inputs.pr || 'all' }}

env:
  MAIN: ${{ github.event.repository.default_branch }}
  TOOL: target/debug/tessera-rebase

jobs:
  plan:
    # Lists the pull requests whose rebase needs only list joins.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: cargo build -q -p tessera-rebase
      - id: plan
        # bash fails the step when the script before the pipe fails.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: tools/scripts/rebase-list.sh | tee -a "$GITHUB_OUTPUT"

  build:
    # Runs pull request code: build scripts and proc macros. They run
    # in a container that holds the work tree and nothing else, so they
    # cannot reach the runner's cache and artifact token. The job token
    # reads only, git does not keep it, and the job does not get secrets.
    # The push job checks what this job uploads.
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pull: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git fetch -q origin "$HEAD"
        env:
          HEAD: ${{ matrix.pull.head }}
      - run: cargo build -q -p tessera-rebase
      - env:
          HEAD: ${{ matrix.pull.head }}
          BASE: ${{ matrix.pull.base }}
          WORK: ${{ runner.temp }}/rebase
          OUT: ${{ runner.temp }}/built
          SANDBOX: docker
          FEATURES: --all-features
          RUSTFLAGS: -D warnings
          CARGO_INCREMENTAL: 0
        run: tools/scripts/rebase-build.sh
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: list-rebase-${{ matrix.pull.pr }}
          path: ${{ runner.temp }}/built
          if-no-files-found: ignore

  push:
    # Does not run pull request code. tessera-rebase plans the rebase
    # again here and takes from the build the files that had a conflict.
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        pull: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      # The identity that pushes: a GitHub App for CI automation, with
      # the two secrets below. With them the app pushes and CI runs on
      # the new head. Without them the workflow token pushes, and
      # GitHub does not start CI for that push.
      # This app is not the tiers app that sets the tier labels. The
      # key of the tiers app must not be an Actions secret.
      HAS_APP: ${{ secrets.REBASE_APP_ID != '' && secrets.REBASE_APP_PRIVATE_KEY != '' }}
    steps:
      - id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.REBASE_APP_ID }}
          private-key: ${{ secrets.REBASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || github.token }}
      - run: cargo build -q -p tessera-rebase
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: list-rebase-${{ matrix.pull.pr }}
          path: ${{ runner.temp }}/built
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ matrix.pull.pr }}
          HEAD: ${{ matrix.pull.head }}
          BASE: ${{ matrix.pull.base }}
          KEY: ${{ matrix.pull.key }}
          BUILT: ${{ runner.temp }}/built
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BOT: ${{ steps.app.outputs.app-slug || 'github-actions' }}
        run: tools/scripts/rebase-push.sh
