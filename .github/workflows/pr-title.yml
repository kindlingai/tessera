# Checks that pull request titles follow Conventional Commits.
# Squash merges copy the title to main for release-please.
name: pr-title

on:
  pull_request:
    types: [opened, reopened, edited, synchronize, ready_for_review]

permissions:
  pull-requests: read

concurrency:
  group: pr-title-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    if: github.event.pull_request.draft != true
    # An orble runner for this org's branches. A fork's code runs on
    # a hosted runner instead.
    runs-on: ${{ (github.event.pull_request == null || github.event.pull_request.head.repo.owner.login == 'kindlingai') && 'orble-1' || 'ubuntu-slim' }}
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5 # v6.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
