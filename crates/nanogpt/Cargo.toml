[package]
name = "nanogpt"
version = "0.1.0"
edition = "2024"
description = "Tiny character-level GPT that runs on the portable Metal/CUDA ops"
license = "MIT"

[dependencies]
gemm = { path = "../gemm" }
ops = { path = "../ops" }
ops-math = { path = "../ops-math" }
ops-model = { path = "../ops-model" }

[features]
default = []
cuda = ["gemm/cuda", "ops/cuda", "ops-math/cuda", "ops-model/cuda"]
rocm = ["gemm/rocm", "ops/rocm", "ops-math/rocm", "ops-model/rocm"]
