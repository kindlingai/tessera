[package]
name = "interp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Runs a graph op by op, on the CPU or the portable GPU ops"

[features]
default = []
# The GPU kernels from the ops crates; Metal on macOS.
gpu = ["dep:gemm", "dep:ops", "dep:ops-math", "dep:ops-model"]
cuda = ["gpu", "gemm/cuda", "ops/cuda", "ops-math/cuda", "ops-model/cuda"]

[dependencies]
graph = { path = "../graph" }
gemm = { path = "../gemm", optional = true }
ops = { path = "../ops", optional = true }
ops-math = { path = "../ops-math", optional = true }
ops-model = { path = "../ops-model", optional = true }

[dev-dependencies]
trace = { path = "../trace" }
