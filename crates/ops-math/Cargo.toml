[package]
name = "ops-math"
version = "0.1.0"
edition = "2024"
description = "Portable GPU ops: elementwise maths, softmax and RMS norm"
license = "MIT"

[features]
default = []
# NVRTC compiles the .cu bodies on first dispatch, so no toolkit is needed.
cuda = ["gpukit/cuda", "ops/cuda"]
# hiprtc compiles the same .cu bodies, so no ROCm toolkit is needed.
rocm = ["gpukit/rocm", "ops/rocm"]

[dependencies]
gpukit = { path = "../gpukit", default-features = false }
ops = { path = "../ops" }
