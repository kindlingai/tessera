[package]
name = "models"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Model descriptions, traced into graphs"

[features]
default = []
cuda = ["interp/cuda", "nanogpt/cuda"]
rocm = ["interp/rocm", "nanogpt/rocm"]

[dependencies]
graph = { path = "../graph" }
trace = { path = "../trace" }

[dev-dependencies]
checkpoint = { path = "../checkpoint" }
interp = { path = "../interp", features = ["gpu"] }
lower = { path = "../lower" }
ops = { path = "../ops" }
nanogpt = { path = "../nanogpt" }
