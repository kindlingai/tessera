[package]
name = "models"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Model descriptions, traced into graphs"

[features]
default = []
cuda = ["interp/cuda", "nanogpt/cuda"]

[dependencies]
graph = { path = "../graph" }
trace = { path = "../trace" }

[dev-dependencies]
interp = { path = "../interp", features = ["gpu"] }
nanogpt = { path = "../nanogpt" }
