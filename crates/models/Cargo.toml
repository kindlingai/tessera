[package]
name = "models"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Model descriptions, traced into graphs"

[features]
default = []
cuda = ["lower/cuda", "calibrate/cuda", "kernels/cuda"]
rocm = ["lower/rocm", "calibrate/rocm", "kernels/rocm"]

[dependencies]
graph = { path = "../graph" }
trace = { path = "../trace" }

[dev-dependencies]
kernels = { path = "../kernels" }
calibrate = { path = "../calibrate" }
checkpoint = { path = "../checkpoint" }
interp = { path = "../interp" }
lower = { path = "../lower" }
ops = { path = "../ops" }
