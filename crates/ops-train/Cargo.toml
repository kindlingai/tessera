[package]
name = "ops-train"
version = "0.1.0"
edition = "2024"
description = "Portable GPU ops for training: backward passes and AdamW"
license = "MIT"

[features]
default = []
# NVRTC compiles the .cu bodies on first dispatch, so no toolkit is needed.
cuda = ["gpukit/cuda", "ops/cuda"]

[dependencies]
gpukit = { path = "../gpukit", default-features = false }
ops = { path = "../ops" }
