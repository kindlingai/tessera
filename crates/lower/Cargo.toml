[package]
name = "lower"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Lowers a graph to a plan of kernel launches"

[features]
default = []
# The runtime loads when a plan first runs, as in gpukit.
cuda = ["gpukit/cuda"]
rocm = ["gpukit/rocm"]

[dependencies]
graph = { path = "../graph" }
sim = { path = "../sim" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
scattered-collect = "0.22"
gpukit = { path = "../gpukit", default-features = false }
gemm = { path = "../gemm" }
ops-model = { path = "../ops-model" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-metal = { version = "0.3", default-features = false, features = [
    "MTLDevice",
    "MTLCommandQueue",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLLibrary",
    "MTLBuffer",
    "MTLResource",
    "MTLAllocation",
    "MTLTypes",
] }

[dev-dependencies]
interp = { path = "../interp" }
models = { path = "../models" }
ops = { path = "../ops" }
trace = { path = "../trace" }
