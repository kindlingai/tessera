[workspace]
resolver = "3"
members = [
    "engine/engine",
    "engine/gpu/*",
    "engine/ir/*",
    "engine/models",
    "engine/plan/*",
    "engine/rules/*",
    "engine/settings",
    "examples/recipes/*/model",
    "frontend/*",
    "tools/calibrate",
    "tools/check",
    "tools/findings",
    "tools/inspect",
    "tools/lint",
    "tools/load",
    "tools/parity",
    "tools/publish",
    "tools/ranks",
    "tools/shape",
    "tools/style",
]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/kindlingai/tessera"

# Every crate here, so members name each other without paths.
[workspace.dependencies]
sensai-calibrate = { path = "tools/calibrate" }
sensai-checkpoint = { path = "frontend/checkpoint" }
sensai-codegen = { path = "engine/plan/codegen" }
sensai-engine-comm = { path = "engine/plan/comm" }
sensai-engine = { path = "engine/engine" }
sensai-engine-settings = { path = "engine/settings" }
sensai-findings = { path = "tools/findings" }
sensai-frontend-comm = { path = "frontend/comm" }
sensai-frontend-settings = { path = "frontend/settings" }
sensai-dl = { path = "engine/gpu/dl" }
sensai-gpukit = { path = "engine/gpu/gpukit" }
sensai-bundle = { path = "frontend/bundle" }
sensai-grammar = { path = "frontend/grammar" }
sensai-graph = { path = "engine/ir/graph" }
sensai-guest = { path = "engine/rules/guest" }
sensai-interp = { path = "engine/ir/interp" }
sensai-host = { path = "engine/plan/host" }
sensai-jit = { path = "engine/plan/jit" }
sensai-kernel-macro = { path = "engine/plan/kernel-macro" }
sensai-kernels = { path = "engine/rules/kernels" }
sensai-kv = { path = "engine/ir/kv" }
sensai-cpu = { path = "engine/rules/cpu" }
sensai-linear = { path = "engine/rules/linear" }
sensai-attention = { path = "engine/rules/attention" }
sensai-rules = { path = "engine/rules/rules" }
sensai-lower = { path = "engine/plan/lower" }
sensai-mem = { path = "engine/ir/mem" }
sensai-models = { path = "engine/models" }
sensai-platform = { path = "engine/gpu/platform" }
sensai-recipe = { path = "frontend/recipe" }
sensai-parity = { path = "tools/parity" }
sensai-run = { path = "engine/plan/run" }
sensai-serve = { path = "frontend/serve" }
sensai-shape = { path = "tools/shape" }
sensai-sim = { path = "engine/plan/sim" }
sensai-work = { path = "engine/gpu/work" }
sensai-tasks = { path = "frontend/tasks" }
sensai-testkit = { path = "engine/ir/testkit" }
sensai-trace = { path = "engine/ir/trace" }
sensai-trace-derive = { path = "engine/ir/trace-derive" }
sensai-wasm = { path = "engine/rules/wasm" }

# The host executor interprets whole kernels, so tests need it optimized.
[profile.dev.package.sensai-host]
opt-level = 3

# The host executor decodes forms through codegen, once per element.
[profile.dev.package.sensai-codegen]
opt-level = 3

# Reference checks run whole models through the interpreter.
[profile.dev.package.sensai-interp]
opt-level = 3
