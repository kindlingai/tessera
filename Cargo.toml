[workspace]
resolver = "3"
members = [
    "engine/engine",
    "engine/gpu/*",
    "engine/ir/*",
    "engine/models",
    "engine/plan/*",
    "engine/rules/*",
    "frontend/*",
    "tools/calibrate",
    "tools/check",
    "tools/findings",
    "tools/lint",
    "tools/shape",
    "tools/style",
]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

# Every crate here, so members name each other without paths.
[workspace.dependencies]
calibrate = { path = "tools/calibrate" }
checkpoint = { path = "frontend/checkpoint" }
gemm = { path = "engine/gpu/gemm" }
codegen = { path = "engine/plan/codegen" }
engine = { path = "engine/engine" }
findings = { path = "tools/findings" }
settings = { path = "frontend/settings" }
gpukit = { path = "engine/gpu/gpukit" }
bundle = { path = "frontend/bundle" }
graph = { path = "engine/ir/graph" }
interp = { path = "engine/ir/interp" }
kernel-macro = { path = "engine/plan/kernel-macro" }
kernels = { path = "engine/rules/kernels" }
linear = { path = "engine/rules/linear" }
lower = { path = "engine/plan/lower" }
mem = { path = "engine/ir/mem" }
models = { path = "engine/models" }
run = { path = "engine/plan/run" }
shape = { path = "tools/shape" }
sim = { path = "engine/plan/sim" }
trace = { path = "engine/ir/trace" }
trace-derive = { path = "engine/ir/trace-derive" }

# The host executor interprets whole kernels, so tests need it optimized.
[profile.dev.package.codegen]
opt-level = 3
