[workspace]
resolver = "3"
members = [
    "engine/engine",
    "engine/gpu/*",
    "engine/ir/*",
    "engine/models",
    "engine/plan/*",
    "engine/rules/*",
    "engine/settings",
    "examples/recipes/*/model",
    "frontend/*",
    "tools/calibrate",
    "tools/check",
    "tools/findings",
    "tools/inspect",
    "tools/lint",
    "tools/load",
    "tools/parity",
    "tools/publish",
    "tools/ranks",
    "tools/references",
    "tools/shape",
    "tools/style",
]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/kindlingai/tessera"

# Every crate here, so members name each other without paths.
[workspace.dependencies]
tessera-calibrate = { path = "tools/calibrate" }
tessera-checkpoint = { path = "frontend/checkpoint" }
tessera-codegen = { path = "engine/plan/codegen" }
tessera-engine-comm = { path = "engine/plan/comm" }
tessera-engine = { path = "engine/engine" }
tessera-engine-settings = { path = "engine/settings" }
tessera-findings = { path = "tools/findings" }
tessera-frontend-comm = { path = "frontend/comm" }
tessera-frontend-settings = { path = "frontend/settings" }
tessera-dl = { path = "engine/gpu/dl" }
tessera-gpukit = { path = "engine/gpu/gpukit" }
tessera-bundle = { path = "frontend/bundle" }
tessera-grammar = { path = "frontend/grammar" }
tessera-graph = { path = "engine/ir/graph" }
tessera-guest = { path = "engine/rules/guest" }
tessera-interp = { path = "engine/ir/interp" }
tessera-host = { path = "engine/plan/host" }
tessera-jit = { path = "engine/plan/jit" }
tessera-kernel-macro = { path = "engine/plan/kernel-macro" }
tessera-kernels = { path = "engine/rules/kernels" }
tessera-kv = { path = "engine/ir/kv" }
tessera-cpu = { path = "engine/rules/cpu" }
tessera-device = { path = "engine/rules/device" }
tessera-linear = { path = "engine/rules/linear" }
tessera-attention = { path = "engine/rules/attention" }
tessera-rules = { path = "engine/rules/rules" }
tessera-lower = { path = "engine/plan/lower" }
tessera-mem = { path = "engine/ir/mem" }
tessera-models = { path = "engine/models" }
tessera-platform = { path = "engine/gpu/platform" }
tessera-recipe = { path = "frontend/recipe" }
tessera-references = { path = "tools/references" }
tessera-parity = { path = "tools/parity" }
tessera-run = { path = "engine/plan/run" }
tessera-serve = { path = "frontend/serve" }
tessera-shape = { path = "tools/shape" }
tessera-sim = { path = "engine/plan/sim" }
tessera-work = { path = "engine/gpu/work" }
tessera-tasks = { path = "frontend/tasks" }
tessera-testkit = { path = "engine/ir/testkit" }
tessera-trace = { path = "engine/ir/trace" }
tessera-trace-derive = { path = "engine/ir/trace-derive" }
tessera-wasm = { path = "engine/rules/wasm" }
tessera-publish = { path = "tools/publish" }

# The host executor interprets whole kernels, so tests need it optimized.
[profile.dev.package.tessera-host]
opt-level = 3

# The host executor decodes forms through codegen, once per element.
[profile.dev.package.tessera-codegen]
opt-level = 3

# Reference checks run whole models through the interpreter.
[profile.dev.package.tessera-interp]
opt-level = 3
