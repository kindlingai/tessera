[workspace]
resolver = "3"
members = [
    "crates/front/*",
    "crates/gpu/*",
    "crates/ir/*",
    "crates/plan/*",
    "crates/rules/*",
    "tools/calibrate",
    "tools/lint",
]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

# Every crate here, so members name each other without paths.
[workspace.dependencies]
calibrate = { path = "tools/calibrate" }
checkpoint = { path = "crates/front/checkpoint" }
gemm = { path = "crates/gpu/gemm" }
gpukit = { path = "crates/gpu/gpukit" }
graph = { path = "crates/ir/graph" }
interp = { path = "crates/ir/interp" }
kernels = { path = "crates/rules/kernels" }
linear = { path = "crates/rules/linear" }
lower = { path = "crates/plan/lower" }
models = { path = "crates/front/models" }
sim = { path = "crates/plan/sim" }
trace = { path = "crates/ir/trace" }
trace-derive = { path = "crates/ir/trace-derive" }
