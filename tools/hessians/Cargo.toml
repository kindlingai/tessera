[package]
name = "tessera-hessians"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Layer-streaming BF16 Hessian calibration generator for exlr8"

[[bin]]
name = "tessera-hessians"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tessera-bundle = { workspace = true }
tessera-checkpoint = { workspace = true }
tessera-device = { workspace = true }
tessera-graph = { workspace = true }
tessera-interp = { workspace = true }
tessera-lower = { workspace = true }
tessera-models = { workspace = true }

[dev-dependencies]
tessera-testkit = { workspace = true }
