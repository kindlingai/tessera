[package]
name = "sensai-inspect"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Draws a model's graph, its lowering per rank, and tokens between ranks"

[[bin]]
name = "tessera-inspect"
path = "src/main.rs"

[dependencies]
sensai-graph = { workspace = true }
sensai-lower = { workspace = true }
sensai-models = { workspace = true }
sensai-platform = { workspace = true }
sensai-rules = { workspace = true }
sensai-sim = { workspace = true }
sensai-trace = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
