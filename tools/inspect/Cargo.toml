[package]
name = "tessera-inspect"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Draws a model's graph, its lowering per rank, and tokens between ranks"

[[bin]]
name = "tessera-inspect"
path = "src/main.rs"

[dependencies]
tessera-device = { workspace = true }
tessera-graph = { workspace = true }
tessera-html = { workspace = true }
tessera-lower = { workspace = true }
tessera-models = { workspace = true }
tessera-platform = { workspace = true }
tessera-rules = { workspace = true }
tessera-sim = { workspace = true }
serde = { version = "1", features = ["derive"] }
