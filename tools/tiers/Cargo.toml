[package]
name = "tessera-tiers"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A board that sets pull request tiers as a GitHub App"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tessera-html = { workspace = true }
base64 = "0.22"
form_urlencoded = "1"
hmac = "0.13"
miniz_oxide = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

# The Worker entry point builds for wasm alone.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
rsa = { version = "0.10", features = ["pkcs1v15"] }
worker = "0.9"
