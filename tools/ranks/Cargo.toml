[package]
name = "tessera-ranks"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Runs one rank of a sharded Qwen3 forward pass, joined over TCP"

[[bin]]
name = "tessera-ranks"
path = "src/main.rs"

[features]
default = []
cuda = ["tessera-run/cuda", "tessera-gpukit/cuda"]
rocm = ["tessera-run/rocm", "tessera-gpukit/rocm"]

[dependencies]
tessera-bundle = { workspace = true }
tessera-checkpoint = { workspace = true }
tessera-device = { workspace = true }
tessera-engine-comm = { workspace = true }
tessera-frontend-comm = { workspace = true }
tessera-frontend-settings = { workspace = true }
tessera-gpukit = { workspace = true }
tessera-graph = { workspace = true }
tessera-interp = { workspace = true }
tessera-rules = { workspace = true }
tessera-lower = { workspace = true }
tessera-models = { workspace = true }
tessera-run = { workspace = true }
tessera-testkit = { workspace = true }
tessera-trace = { workspace = true }
