[package]
name = "sensai-ranks"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Runs one rank of a sharded Qwen3 forward pass, joined over TCP"

[[bin]]
name = "tessera-ranks"
path = "src/main.rs"

[features]
default = []
cuda = ["sensai-run/cuda"]
rocm = ["sensai-run/rocm"]

[dependencies]
sensai-bundle = { workspace = true }
sensai-checkpoint = { workspace = true }
sensai-engine-comm = { workspace = true }
sensai-frontend-comm = { workspace = true }
sensai-frontend-settings = { workspace = true }
sensai-graph = { workspace = true }
sensai-interp = { workspace = true }
sensai-rules = { workspace = true }
sensai-lower = { workspace = true }
sensai-models = { workspace = true }
sensai-run = { workspace = true }
sensai-sim = { workspace = true }
sensai-testkit = { workspace = true }
sensai-trace = { workspace = true }
