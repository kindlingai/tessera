[package]
name = "load"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Drives concurrent requests against tessera-serve and reports throughput"

[[bin]]
name = "tessera-load"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
