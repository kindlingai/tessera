[package]
name = "sensai-parity"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Every model against its reference, the interpreter and the device"

[features]
default = []
cuda = ["sensai-run/cuda"]
rocm = ["sensai-run/rocm"]

[dependencies]
serde_json = "1"
sensai-bundle = { workspace = true }
sensai-checkpoint = { workspace = true }
sensai-graph = { workspace = true }
sensai-interp = { workspace = true }
sensai-rules = { workspace = true }
sensai-lower = { workspace = true }
sensai-run = { workspace = true }
sensai-testkit = { workspace = true }
sensai-trace = { workspace = true }

[dev-dependencies]
sensai-codegen = { workspace = true }
sensai-engine = { workspace = true }
sensai-engine-settings = { workspace = true }
sensai-models = { workspace = true }
sensai-recipe = { workspace = true }
