[package]
name = "tessera-parity"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Every model against its reference, the interpreter and the device"

[features]
default = []
cuda = ["tessera-run/cuda", "tessera-device/cuda"]
rocm = ["tessera-run/rocm", "tessera-device/rocm"]

[dependencies]
serde_json = "1"
tessera-bundle = { workspace = true }
tessera-checkpoint = { workspace = true }
tessera-device = { workspace = true }
tessera-graph = { workspace = true }
tessera-interp = { workspace = true }
tessera-rules = { workspace = true }
tessera-lower = { workspace = true }
tessera-run = { workspace = true }
tessera-testkit = { workspace = true }
tessera-trace = { workspace = true }

[dev-dependencies]
tessera-codegen = { workspace = true }
tessera-engine = { workspace = true }
tessera-engine-settings = { workspace = true }
tessera-models = { workspace = true }
tessera-recipe = { workspace = true }
