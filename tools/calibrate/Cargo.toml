[package]
name = "sensai-calibrate"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Times kernels on this machine and stores what they cost"

[features]
default = []
cuda = ["sensai-run/cuda"]
rocm = ["sensai-run/rocm"]

[[bin]]
name = "tessera-calibrate"
path = "src/main.rs"

[dependencies]
sensai-testkit = { workspace = true }
sensai-bundle = { workspace = true }
sensai-codegen = { workspace = true }
sensai-frontend-settings = { workspace = true }
sensai-graph = { workspace = true }
sensai-engine = { workspace = true }
sensai-models = { workspace = true }
sensai-trace = { workspace = true }
sensai-lower = { workspace = true }
sensai-sim = { workspace = true }
sensai-rules = { workspace = true }
sensai-run = { workspace = true }

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
