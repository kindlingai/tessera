[package]
name = "tessera-calibrate"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Times kernels on this machine and stores what they cost"

[features]
default = []
cuda = ["tessera-run/cuda"]
rocm = ["tessera-run/rocm"]

[[bin]]
name = "tessera-calibrate"
path = "src/main.rs"

[dependencies]
tessera-testkit = { workspace = true }
tessera-bundle = { workspace = true }
tessera-codegen = { workspace = true }
tessera-frontend-settings = { workspace = true }
tessera-graph = { workspace = true }
tessera-engine = { workspace = true }
tessera-models = { workspace = true }
tessera-recipe = { workspace = true }
tessera-serve = { workspace = true }
tessera-trace = { workspace = true }
tessera-lower = { workspace = true }
tessera-sim = { workspace = true }
tessera-rules = { workspace = true }
tessera-run = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
