[package]
name = "calibrate"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Times kernels on this machine and stores what they cost"

[features]
default = []
cuda = ["lower/cuda", "kernels/cuda"]
rocm = ["lower/rocm", "kernels/rocm"]

[[bin]]
name = "tessera-calibrate"
path = "src/main.rs"

[dependencies]
codegen = { workspace = true }
settings = { workspace = true }
graph = { workspace = true }
trace = { workspace = true }
lower = { workspace = true }
sim = { workspace = true }
kernels = { workspace = true }
linear = { workspace = true }
gpukit = { workspace = true }

[dev-dependencies]
