name: 'Commit messages'
description: 'A commit message restates the diff, gives canned assurance, or asserts preserved behaviour.'
group: commits
examples: '.txt'
detectors:
  # Canned assurance and asserted preservation.
  - 're:(?i)\ball (the )?tests pass'
  - 're:(?i)\b(preserv|retain)(e|es|ed|ing) (all )?(the )?(existing|previous|original) (behaviou?r|functionality)'
  - 're:(?i)\bavoid(ed|s|ing)? (any )?breaking changes'
  - 're:(?i)\bfollows? (the )?existing conventions'
  - 're:(?i)\bimprov(e|es|ed|ing) (the )?(overall )?(clarity|readability|consistency|maintainability)'
