name: 'Rare words'
description: 'Among equally exact words, use the commonest ("use" for "utilize").'
group: comments
stage: 3
detectors:
  # Stage 3: era-specific, expected to drift.
  - 'leverage'
  - 'utilize'
  - 'delve'
  - 'robust'
  - 'seamless'
  - 'comprehensive'
  - 'crucial'
  - 'pivotal'
  - 'underscore'
  - 'testament'
  - 'tapestry'
  - 'streamline'
  - 'facilitate'
  - 'garner'
  - 'myriad'
  - 'elevate'
  - 'harness'
  - 'intricate'
  - 'nuanced'
  - 'golden'
  - 'load-bearing'
  - 'measure'
  - 'spend'
  - 'mint'
  # Stage 3: circumlocutions for "is" and "has".
  - 'serves as'
  - 'functions as'
  - 'acts as'
  - 'represents a'
  - 'provides a way to'
  - 'plays a role'
