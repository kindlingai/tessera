name: 'Causal fragment'
description: 'A fragment with no main verb makes a causal claim ("Routes that share a prefix, merged so a lookup reads one node"). Give the claim a subject and a verb.'
group: comments
stage: 2
# The shape varies too much for a regex, so this rule has only a Jev question.
# A yes or no question flagged every sentence with a reason in it, so this
# asks Jev to pick between the two shapes.
# jev_parse.py checks this rule when uv is available. The parse finds a sentence
# with no finite verb, which the Jev question confused with any sentence that
# gives a reason. The detectors and Jev question are the fallback for --no-
# parse.
parse: true
jev:
  type: choice
  question: 'Find each sentence that gives a reason, with ''so'', ''because'', ''so that'' or ''to''. Does that sentence have its own subject and main verb?'
  labels:
    full_sentence: 'Every sentence that gives a reason has a subject and a main verb: ''The keys are sorted, so the merge is linear'''
    fragment: 'A reason sits in a fragment with no main verb: ''Sorted by key, so the merge is linear'' or ''Routes that share a prefix, merged so a lookup reads one node'''
    no_reason: 'No sentence gives a reason'
  violation: fragment
  # The re-check sees the added lines alone, so prose the change did not
  # write cannot fire it.
  recheck: added
