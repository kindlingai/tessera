name: 'Internal references'
description: 'A comment cites a section or item in an internal document ("§23", "Q43"). External issue trackers are fine.'
group: comments
stage: 0
detectors:
  # Internal document pointers. External issue trackers are fine.
  - 're:[¡❡]\d+'
  - 're:§\d+'
  - 're:\bQ\d+\b'
  # Spelled-out form. `Q30` is caught above, "open question 30" was not.
  - 're:open question \d+'
  - 're:open item \d+'
jev:
  type: noul
  question: 'Does a comment cite a section number or item in some internal document, such as ''§23'', ''❡1'' or ''Q43''? Links to GitHub or an issue tracker are fine.'
  'true': 'A comment cites an internal document section or item'
  'false': 'No internal document citations'
  # The re-check sees the added lines alone, so prose the change did not
  # write cannot fire it.
  recheck: added
