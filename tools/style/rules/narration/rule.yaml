name: 'Narration'
description: 'A comment narrates writing the code ("Now let''s handle...").'
group: comments
stage: 5
detectors:
  # Stage 5: describes writing the code.
  - 're:^\s*(//+|#|\*)\s*(Let''s|We''ll|Now we|First we|Next we|Here we)\b'
  - 'feel free to'
  - 'as of this writing'
  - 'my knowledge cutoff'
  - 're:(?i)\bas of my (last|latest) (update|training)'
jev:
  type: noul
  question: 'Does a comment narrate the act of writing the code, such as ''Now let''s handle'' or ''Here we make sure''?'
  'true': 'A comment narrates the author''s process'
  'false': 'Comments describe the code itself'
  # The re-check sees the added lines alone, so prose the change did not
  # write cannot fire it.
  recheck: added
