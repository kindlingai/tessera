name: 'Restated code'
description: 'A comment repeats the code beside it, or states the obvious to an advanced reader.'
group: comments
stage: 0
jev:
  type: noul
  question: 'Could a ''//'' or ''#'' comment be deleted with no fact lost, because the next line of code already says the same thing? A comment that states a hazard, a reason, or a cost the code cannot show is needed. Doc comments (''///'', ''/**'', docstrings) are always needed, so ignore them.'
  'true': 'A comment only repeats the code below it'
  'false': 'Each comment states a reason, hazard or cost, or there are no inline comments'
  # Prose files skip this question.
  applies_to: code
