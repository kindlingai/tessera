name: 'Heavy participle subject'
description: 'A noun and an "-ing" phrase come before the main verb ("A file containing the key is read first"). Lead with the actor or the instruction.'
group: comments
stage: 2
# The shape is common in plain prose ("the thread holding the lock"), so a
# regex would fire on good sentences. This rule has only a Jev question.
jev:
  type: noul
  question: 'Does a sentence open with a subject made of a noun followed by an ''-ing'' phrase, such as ''A line holding only a dash separates examples'' or ''A file containing the key is read first'', where leading with the actor or giving an instruction would read more directly? A short phrase that names a role, such as ''the thread holding the lock'', is fine.'
  'true': 'A sentence opens with a heavy participle subject'
  'false': 'Sentences lead with a plain subject or an instruction'
  # The re-check sees the added lines alone, so prose the change did not
  # write cannot fire it.
  recheck: added
