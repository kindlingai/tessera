name: 'Live metaphor'
description: 'A figure of speech the reader must decode where a plain word exists ("blast radius" for "scope").'
group: comments
stage: 5
jev:
  type: noul
  question: 'Does a comment use a vivid figure of speech that the reader must decode, where a plain word exists, such as ''blast radius'' for ''scope'' or ''lives in'' for ''is in''? Established technical terms like deadlock, handshake, orphan, reaper, race, leak and thread are plain words.'
  'true': 'A comment uses a vivid figure of speech'
  'false': 'Comments use plain words and established technical terms'
  # The re-check sees the added lines alone, so prose the change did not
  # write cannot fire it.
  recheck: added
