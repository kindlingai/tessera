name: 'Announced shape'
description: 'A comment announces the shape or count of its explanation ("Two rules.", "There are three things").'
group: comments
stage: 5
detectors:
  # A spelled-out count opening a comment: "Two rules, ...". Mid-sentence, "one
  # set, so" is ordinary prose.
  - 're:^\s*(//+|#|\*)?\s*(?i:one|two|three|four|five|six|seven|eight|nine|ten) \w+,'
  # Stage 5: announces the explanation's shape instead of giving it. The list
  # below already shows the count.
  - 're:^\s*(//+|#|\*)?\s*(Two|Three|Four|Five|Several) (rules|things|reasons|steps|cases|parts|considerations|points)\b'
  - 're:There are (two|three|four|five|several)\b'
  - 're:^\s*(//+|#|\*)?\s*(This|The) (section|paragraph|document|list) (covers|describes|explains|outlines)\b'
  - 'at a high level'
  - 'from a .* perspective'
  - 'the key thing'
  - 'the main consideration'
  - 'it is important to'
  - 'governs'
jev:
  type: noul
  question: 'Does a comment announce the shape or count of what follows, such as ''Two rules.'' or ''There are three things to consider''?'
  'true': 'A comment announces a count or structure'
  'false': 'Comments give the content directly'
  # The re-check sees the added lines alone, so prose the change did not
  # write cannot fire it.
  recheck: added
  # A heading is a label, and Jev scores bare headings like "## Announcing
  # endpoints" at 1.00.
  ignore_headings: true
