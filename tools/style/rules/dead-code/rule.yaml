name: 'Dead code'
description: 'Commented-out code, dead code, unused parameters, or a declaration far from its first use.'
group: code
jev:
  type: noul
  question: 'Does the new code add commented-out code, dead code, or unused parameters?'
  'true': 'Dead or commented-out code is present'
  'false': 'No dead code'
  # Prose files skip this question.
  applies_to: code
  # This rule judges code, so it can hold on a hunk that adds no comment.
  judges: code
