# black-forest-labs/FLUX.2-klein-4B: a prompt to a picture.
name = "flux2-klein"

[weights]
hf = "black-forest-labs/FLUX.2-klein-4B@e7b7dc27f91deacad38e78976d1f2b499d76a294"

# The diffusers pipeline sets these in code, not in a config file.
[config.pipeline]
# The Qwen3 layers the transformer reads, as hidden states.
text_layers = [9, 18, 27]
# Text rows each prompt pads to.
text_rows = 512
steps = 4

[serve]
task = "image"
