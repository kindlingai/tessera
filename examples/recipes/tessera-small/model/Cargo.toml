[package]
name = "sensai-sprite-module"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "tessera-small's graph and tables, as a recipe module"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sensai-guest = { workspace = true }
sensai-models = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
