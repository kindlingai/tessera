# Each test runs in its own process, so golden.rs's turn lock holds
# nothing. Tests that load a real checkpoint run one at a time.
[test-groups]
checkpoint = { max-threads = 1 }

# Every test is killed after 60 s.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 1 }

[[profile.default.overrides]]
filter = 'binary(tessera_models) & test(/::(golden|gpu|native|reference_checks)$/)'
test-group = 'checkpoint'

[profile.ci]
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 2 }
failure-output = "immediate-final"

[profile.ci.junit]
path = "junit.xml"
store-success-output = true
