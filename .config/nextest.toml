# Each test runs in its own process, so golden.rs's turn lock holds
# nothing. Tests that load a real checkpoint run one at a time.
[test-groups]
checkpoint = { max-threads = 1 }

# Every test is killed after 60 s. Checkpoint tests get 5 min.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 1 }

[[profile.default.overrides]]
filter = 'binary_id(tessera-parity::parity) & test(/::(golden|gpu|reference_checks)$/)'
test-group = 'checkpoint'
slow-timeout = { period = "60s", terminate-after = 5 }

# One full klein transformer step on the host CPU.
[[profile.default.overrides]]
filter = 'binary_id(tessera-tasks) & test(=flow_test::matches_torch)'
test-group = 'checkpoint'
slow-timeout = { period = "60s", terminate-after = 5 }

# Every planned kernel through each toolkit's compiler, for each target.
# The kernel count grows with each new kernel.
[[profile.default.overrides]]
filter = 'binary_id(tessera-models::kernels_test) & test(/_kernels_compile$/)'
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 2 }
failure-output = "immediate-final"

[profile.ci.junit]
path = "junit.xml"
store-success-output = true
