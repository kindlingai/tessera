# Code-shape limits. tools/lint compiles these in, and CI and the hook enforce them.

# Words in one comment block. Adjacent comment lines are one block.
max_comment_words = 10
# A `;` in a comment must sit in backticks or a ``` block.
# This also covers `#` comments in `hash_comment_files`.

# Snake-case segments in a function name, and when a shared prefix
# or suffix lets a name go one longer.
max_name_segments = 3
max_family_segments = 4

max_file_lines = 1000

# Source files per crate: a base, plus more for each source
# directory beyond the first. macros/ directories do not count.
max_crate_files_base = 25
max_crate_files_addl_module = 3
max_crate_lines = 15000

# Per language in a crate's macros/ directory, outside the crate limits.
max_macro_files = 5
min_macro_calls = 2

# Share of a file inline tests may fill, in percent.
max_test_percent = 1

# The percent of a module plus its tests that #[test] fns fill.
# Unpaired test files count against the rest of their crate.
max_module_test_percent = 25

# Steps of non-blank lines in a run of line shapes, and the most
# places one run that long may appear in files of one type.
# Shapes collapse names and numbers. Struct fields keep their names.
shape_steps = [[10, 3], [20, 2], [40, 1]]

# tools/simcheck starts windows of lines at anchors its content picks,
# about `similar_spacing` apart. Windows fail at `max_similarity` cosine.
similar_window = 20
similar_spacing = 7
max_similarity = 0.97
# A new file nearer another crate than its own by this
# much gets a note in the pull request. It does not fail.
max_lean = 0.03

# File types the rules read.
extensions = ["rs", "metal", "cu", "cuh", "h", "hpp", "c", "cc", "cpp", "wgsl", "hip"]

# Files with `#` comments. Only the semicolon rule reads these.
hash_comment_files = ["*.toml", "*.yml", "*.yaml", "*.sh", ".githooks/*"]
