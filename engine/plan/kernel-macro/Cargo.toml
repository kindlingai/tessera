[package]
name = "kernel-macro"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "#[kernel]: a Rust function body as a kernel tree"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
