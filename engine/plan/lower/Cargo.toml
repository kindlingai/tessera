[package]
name = "lower"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Lowers a graph to a plan of kernel launches"

[dependencies]
graph = { workspace = true }
sim = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
scattered-collect = "0.22"
codegen = { workspace = true }
kernel-macro = { workspace = true }
gpukit = { workspace = true }
mem = { workspace = true }

[dev-dependencies]
settings = { workspace = true }
kernels = { workspace = true }
linear = { workspace = true }
interp = { workspace = true }
models = { workspace = true }
run = { workspace = true }
trace = { workspace = true }
