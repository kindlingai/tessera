[package]
name = "run"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Runs lowered plans on the host, Metal, CUDA or ROCm"

[features]
default = []
# The runtime loads when a plan first runs, as in gpukit.
cuda = ["gpukit/cuda"]
rocm = ["gpukit/rocm"]

[dependencies]
codegen = { workspace = true }
gpukit = { workspace = true }
graph = { workspace = true }
lower = { workspace = true }
mem = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-metal = { version = "0.3", default-features = false, features = [
    "MTLDevice",
    "MTLCommandQueue",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLLibrary",
    "MTLBuffer",
    "MTLResource",
    "MTLAllocation",
    "MTLTypes",
] }
