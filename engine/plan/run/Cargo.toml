[package]
name = "tessera-run"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Runs lowered plans on the host, Metal, CUDA or ROCm"

[features]
default = []
# The runtime loads when a plan first runs, as in gpukit.
cuda = ["tessera-gpukit/cuda"]
rocm = ["tessera-gpukit/rocm"]

[dependencies]
tessera-codegen = { workspace = true }
tessera-host = { workspace = true }
tessera-engine-comm = { workspace = true }
tessera-engine-settings = { workspace = true }
tessera-gpukit = { workspace = true }
tessera-graph = { workspace = true }
tessera-jit = { workspace = true }
tessera-lower = { workspace = true }
tessera-mem = { workspace = true }
rayon = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.8"

[dev-dependencies]
tessera-interp = { workspace = true }
serde_json = "1"
tessera-sim = { workspace = true }
tessera-testkit = { workspace = true }
tessera-trace = { workspace = true }
