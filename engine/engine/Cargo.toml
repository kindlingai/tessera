[package]
name = "tessera-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Runs graphs: a decode loop over a stepper, or one forward launch"

[features]
default = []
cuda = ["tessera-run/cuda", "tessera-device/cuda"]
rocm = ["tessera-run/rocm", "tessera-device/rocm"]

[dependencies]
tessera-device = { workspace = true }
tessera-engine-comm = { workspace = true }
tessera-engine-settings = { workspace = true }
tessera-graph = { workspace = true }
tessera-interp = { workspace = true }
tessera-kv = { workspace = true }
tessera-turns = { workspace = true }
tessera-rules = { workspace = true }
tessera-wasm = { workspace = true }
tessera-lower = { workspace = true }
tessera-mem = { workspace = true }
tessera-models = { workspace = true }
tessera-run = { workspace = true }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tessera-trace = { workspace = true }

[dev-dependencies]
tessera-testkit = { workspace = true }
