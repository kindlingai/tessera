[package]
name = "sensai-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Runs graphs: a decode loop over a stepper, or one forward launch"

[features]
default = []
cuda = ["sensai-run/cuda"]
rocm = ["sensai-run/rocm"]

[dependencies]
sensai-engine-comm = { workspace = true }
sensai-engine-settings = { workspace = true }
sensai-graph = { workspace = true }
sensai-interp = { workspace = true }
sensai-kv = { workspace = true }
sensai-rules = { workspace = true }
sensai-wasm = { workspace = true }
sensai-lower = { workspace = true }
sensai-mem = { workspace = true }
sensai-models = { workspace = true }
sensai-run = { workspace = true }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
sensai-trace = { workspace = true }

[dev-dependencies]
sensai-testkit = { workspace = true }
