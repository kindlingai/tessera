[package]
name = "tessera-gpukit"
version = "0.1.0"
edition = "2024"
description = "The GPU runtimes tessera loads at run time: pipelines and buffers"
license = "MIT"

[features]
default = []
# CUDA backend. The driver is resolved at runtime, so enabling this does not
# require a CUDA toolkit to build. Running a kernel does.
cuda = []
# ROCm backend. The HIP runtime and hiprtc load at runtime, like CUDA.
rocm = []

[dependencies]
thiserror = "2"
tessera-dl = { workspace = true }
tessera-engine-settings = { workspace = true }
tessera-mem = { workspace = true }
tessera-platform = { workspace = true }

[dev-dependencies]
tessera-testkit = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-metal = { version = "0.3", default-features = false, features = [
    "MTLDevice",
    "MTLCommandQueue",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLBinaryArchive",
    "MTLIndirectCommandBuffer",
    "MTLIndirectCommandEncoder",
    "MTLAllocation",
    "MTLLibrary",
    "MTLBuffer",
    "MTLResource",
    "MTLTypes",
    "MTLFunctionConstantValues",
    "MTLDataType",
    "block2",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
    "NSError",
    "NSURL",
    "NSArray",
] }
