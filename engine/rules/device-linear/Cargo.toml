[package]
name = "tessera-device-linear"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Device CUDA linear matmul, trellis MMA, and decode GEMV rules"

[features]
default = []
cuda = ["tessera-device/cuda"]
rocm = ["tessera-device/rocm"]

[dependencies]
tessera-device = { workspace = true }
tessera-graph = { workspace = true }
tessera-linear = { workspace = true }
tessera-mem = { workspace = true }
tessera-lower = { workspace = true }

[dev-dependencies]
tessera-gpukit = { workspace = true }
tessera-interp = { workspace = true }
tessera-kernels = { workspace = true }
tessera-run = { workspace = true }
tessera-testkit = { workspace = true }
