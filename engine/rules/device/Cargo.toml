[package]
name = "tessera-device"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Device headers, import scanner, host proxy and launcher for recipe kernels"

[features]
default = []
cuda = ["tessera-gpukit/cuda"]
rocm = ["tessera-gpukit/rocm"]

[dependencies]
tessera-engine-comm = { workspace = true }
tessera-gpukit = { workspace = true }
tessera-graph = { workspace = true }
tessera-lower = { workspace = true }
tessera-mem = { workspace = true }
tessera-run = { workspace = true }
thiserror = "2"

[dev-dependencies]
tessera-codegen = { workspace = true }
tessera-host = { workspace = true }
tessera-mem = { workspace = true }
tessera-testkit = { workspace = true }
