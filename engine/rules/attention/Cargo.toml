[package]
name = "tessera-attention"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Attention kernels for the CPU and the GPU, registered as lowering rules"

[features]
default = []
cuda = ["tessera-device/cuda"]
rocm = ["tessera-device/rocm"]

[dependencies]
tessera-codegen = { workspace = true }
tessera-device = { workspace = true }
tessera-graph = { workspace = true }
tessera-lower = { workspace = true }

[dev-dependencies]
tessera-gpukit = { workspace = true }
tessera-interp = { workspace = true }
tessera-kernels = { workspace = true }
tessera-run = { workspace = true }
tessera-testkit = { workspace = true }
tessera-trace = { workspace = true }
