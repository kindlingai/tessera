[package]
name = "sensai-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Lowering rules a sandboxed wasm module proposes, over JSON"

[dependencies]
sensai-graph = { workspace = true }
sensai-guest = { workspace = true }
sensai-lower = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
wasmi = "0.51"

[dev-dependencies]
sensai-interp = { workspace = true }
sensai-kernels = { workspace = true }
sensai-linear = { workspace = true }
sensai-run = { workspace = true }
sensai-testkit = { workspace = true }
sensai-trace = { workspace = true }
wat = "1"
